<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-level=1.0">
  <title>Register | Home Tuition Management Agency</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .auth-bg {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      object-fit: cover;
      z-index: -2;
    }
    .auth-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      z-index: -1;
    }
  </style>
</head>
<body>

  <div class="auth-toggles">
    <button class="theme-toggle" aria-label="Toggle Dark Mode">
      <i class="fas fa-moon"></i>
    </button>
    <button class="rtl-toggle" aria-label="Toggle RTL">
      <i class="fas fa-exchange-alt"></i>
    </button>
  </div>

  <div class="auth-page">
    <img src="assets/images/img2.png" alt="Background" class="auth-bg">
    <div class="auth-overlay"></div>
    
    <div class="auth-card">
      <div class="text-center" style="margin-bottom: 2rem;">
        <a href="index.html" class="logo" style="justify-content: center;">
          <i class="fas fa-graduation-cap"></i>
          <span>EduTuition</span>
        </a>
        <p style="color: var(--text-light); margin-top: 0.5rem;">Create an account to get started.</p>
      </div>
      
      <form action="index.html">
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input type="text" class="form-control" placeholder="John Doe" required>
        </div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" placeholder="Enter your email" required>
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <div class="password-wrapper">
            <input type="password" class="form-control" id="password" placeholder="Create a password" required>
            <i class="fas fa-eye password-toggle" id="togglePassword"></i>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Confirm Password</label>
          <div class="password-wrapper">
            <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm your password" required>
            <i class="fas fa-eye password-toggle" id="toggleConfirmPassword"></i>
          </div>
        </div>

        <div class="form-group" style="display: flex; align-items: flex-start; gap: 0.75rem; margin-bottom: 1.5rem;">
          <input type="checkbox" id="terms" required style="width: 18px; height: 18px; margin-top: 0.15rem; cursor: pointer; accent-color: var(--primary); flex-shrink: 0;">
          <label for="terms" style="font-size: 0.875rem; color: var(--text-light); line-height: 1.4; cursor: pointer; flex: 1; white-space: normal !important;">
            I agree to the <a href="#" style="color: var(--primary); font-weight: 500;">Terms of Service</a> and <a href="#" style="color: var(--primary); font-weight: 500;">Privacy Policy</a>
          </label>
        </div>
        
        <button type="submit" class="btn btn-primary auth-btn">Create Account</button>

        <div class="social-auth-divider">
          <hr>
          <span>Or continue with</span>
        </div>
        
        <div class="social-auth-group">
          <button type="button" class="btn btn-social">
            <i class="fab fa-google" style="color: #DB4437;"></i> Google
          </button>
          <button type="button" class="btn btn-social">
            <i class="fab fa-apple"></i> Apple
          </button>
        </div>
      </form>
      
      <p class="text-center" style="margin-top: 2rem; color: var(--text-light); font-size: 0.875rem;">
        Already have an account? <a href="login.html" style="color: var(--primary); font-weight: 500;">Sign in</a>
      </p>
    </div>
  </div>

  <script>
    const togglePassword = document.querySelector('#togglePassword');
    const password = document.querySelector('#password');
    const toggleConfirmPassword = document.querySelector('#toggleConfirmPassword');
    const confirmPassword = document.querySelector('#confirmPassword');

    function handleToggle(toggleBtn, inputField) {
      toggleBtn.addEventListener('click', function (e) {
        const type = inputField.getAttribute('type') === 'password' ? 'text' : 'password';
        inputField.setAttribute('type', type);
        this.classList.toggle('fa-eye-slash');
      });
    }

    handleToggle(togglePassword, password);
    handleToggle(toggleConfirmPassword, confirmPassword);
  </script>
  <script src="assets/js/main.js"></script>
</body>
</html>
